<div class="flex min-h-screen items-center justify-center bg-slate-100 px-4 py-12">
  <div class="w-full max-w-md rounded-2xl border border-slate-200 bg-white p-8 shadow-lg">
    <div class="mb-8 text-center">
      <div class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-2xl bg-blue-600 text-xl font-bold text-white">
        SM
      </div>

      <h1 class="text-2xl font-bold text-slate-900">
        School Manager
      </h1>

      <p class="mt-2 text-sm text-slate-500">
        Sign in to manage your school
      </p>
    </div>

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="space-y-5">
      <div>
        <label for="username" class="mb-2 block text-sm font-medium text-slate-700">
          Username
        </label>

        <input
          id="username"
          name="username"
          type="text"
          [(ngModel)]="username"
          required
          autocomplete="username"
          class="w-full rounded-lg border border-slate-300 px-4 py-3 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
          placeholder="Enter your username"
        />
      </div>

      <div>
        <label for="password" class="mb-2 block text-sm font-medium text-slate-700">
          Password
        </label>

        <input
          id="password"
          name="password"
          type="password"
          [(ngModel)]="password"
          required
          autocomplete="current-password"
          class="w-full rounded-lg border border-slate-300 px-4 py-3 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
          placeholder="Enter your password"
        />
      </div>

      <div
        *ngIf="errorMessage"
        role="alert"
        class="rounded-lg border border-red-200 bg-red-50 p-3 text-sm text-red-700"
      >
        {{ errorMessage }}
      </div>

      <button
        type="submit"
        [disabled]="loading || loginForm.invalid"
        class="w-full rounded-lg bg-blue-600 px-4 py-3 font-semibold text-white transition hover:bg-blue-700 disabled:cursor-not-allowed disabled:opacity-60"
      >
        {{ loading ? 'Signing in...' : 'Sign in' }}
      </button>
    </form>

    <p class="mt-6 text-center text-xs text-slate-500">
      School Management System
    </p>
  </div>
</div>
