<div class="min-h-screen bg-slate-100 text-slate-800 md:flex">
  <aside class="w-full bg-slate-900 p-5 text-white md:min-h-screen md:w-64 md:shrink-0">
    <a routerLink="/" class="mb-8 flex items-center gap-3 text-xl font-bold">
      <span class="rounded-lg bg-blue-600 p-2">SM</span>
      School Manager
    </a>

    <p class="mb-3 text-xs font-semibold uppercase tracking-widest text-slate-400">
      Administration
    </p>

    <nav class="space-y-2">
      <a routerLink="/" routerLinkActive="bg-slate-700 text-white"
         [routerLinkActiveOptions]="{ exact: true }"
         class="block rounded-lg px-4 py-3 text-slate-300 hover:bg-slate-800">
        Dashboard
      </a>

      <a routerLink="/students" routerLinkActive="bg-slate-700 text-white"
         class="block rounded-lg px-4 py-3 text-slate-300 hover:bg-slate-800">
        Students
      </a>

      <a routerLink="/teachers" routerLinkActive="bg-slate-700 text-white"
         class="block rounded-lg px-4 py-3 text-slate-300 hover:bg-slate-800">
        Teachers
      </a>
    </nav>
  </aside>

  <div class="min-w-0 flex-1">
    <header class="flex items-center justify-between border-b border-slate-200 bg-white px-6 py-4">
      <div>
        <p class="text-sm text-slate-500">School administration</p>
        <h1 class="text-xl font-bold">School Management System</h1>
      </div>
      <span class="rounded-full bg-blue-50 px-3 py-2 text-sm font-medium text-blue-700">
        Administrator
      </span>
    </header>

    <main class="p-6">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
